[workspace]
resolver = "2"
members = [
    "crates/nexus-input",
    "crates/nexus-macro",
    "crates/nexus-script",
    "crates/nexus-core",
    "crates/nexus-agents",
    "crates/nexus-vision",
    "crates/nexus-decision",
    "crates/nexus-scheduler",
    "crates/nexus-market",
    "crates/nexus-selfimprove",
    "crates/nexus-breeding",
    "crates/nexus-model",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"

[profile.release]
lto = true
